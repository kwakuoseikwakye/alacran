name: Package Linux (.deb)

# Builds scripts/package-linux.sh's .deb on a real Ubuntu runner (this app's
# own dev machine is macOS, which has no dpkg-deb) and publishes it to the
# public kwakuoseikwakye/alacran-releases repo, alongside the existing
# .dmg/.zip for the same version tag.
#
# Triggers automatically on any vX.Y.Z tag pushed to this repo — no manual
# approval step, per the decision to automate this rather than gate it
# behind a button. The vitest + `next build`'s own internal type-checking
# are the safety net: a failing build never reaches the packaging step, so
# nothing broken gets published to a public repo unattended. (A standalone
# `tsc --noEmit` step was tried and removed — it fails on a fresh checkout
# because next-env.d.ts, which declares static-image-import types, is
# gitignored and only gets generated by an actual Next.js command; `next
# build` generates it before type-checking itself, so it isn't affected.)
#
# Also runnable on demand (workflow_dispatch) against an EXISTING release
# tag — used to backfill a .deb onto a release that predates this workflow,
# without needing a new version bump/tag (which would risk the "latest"
# download links pointing at a release missing the macOS assets, since
# those are still built/uploaded manually).
#
# The published asset is always named Alacran.deb (not the versioned
# alacran_X.Y.Z_all.deb the script produces locally) so the landing page's
# .../releases/latest/download/Alacran.deb link stays stable across
# versions — same convention as the existing Alacran.dmg/Alacran.zip.
#
# Requires a repo secret RELEASES_REPO_TOKEN: a token with write access to
# kwakuoseikwakye/alacran-releases (this workflow runs in the alacran repo,
# a different one, so the default GITHUB_TOKEN — scoped only to the repo
# the workflow runs in — can't publish there).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing alacran-releases tag to attach the .deb to (e.g. v0.1.0). Must match this checkout's package.json version."
        required: true

permissions:
  contents: read

jobs:
  build-and-publish-deb:
    # Forks have none of this repo's secrets; only the upstream repo publishes.
    if: github.repository == 'kwakuoseikwakye/alacran'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        # npm ci fails here: package-lock.json's entry for the Linux-x64
        # optional native-binding subtree is out of sync (confirmed —  a real
        # `npm ci` on macOS never notices, since it never resolves that
        # platform's optional subtree at all; a real `npm ci` on Linux does
        # and finds it inconsistent). npm install reconciles instead of
        # hard-failing on that drift.
        run: npm install

      # The dispatch input reaches the shell through env, never through `${{ }}`
      # interpolated into the script text: an expression is pasted in verbatim
      # before bash ever sees it, so a tag like `v1.0.0"; curl … | sh; #` would
      # run as a command, and an embedded newline would write extra lines into
      # $GITHUB_ENV and set arbitrary variables for every later step. Only
      # someone with write access can dispatch this, which is why it's a
      # hardening fix and not an incident — but it's the shape that turns any
      # future trigger into a real one. Validating here (not in the next step)
      # matters: interpolation would execute before any later check could run.
      - name: Resolve the target tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TARGET_TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing target tag '$TARGET_TAG' — expected vX.Y.Z."
            exit 1
          fi
          printf 'TARGET_TAG=%s\n' "$TARGET_TAG" >> "$GITHUB_ENV"

      - name: Verify the target tag matches package.json's version
        run: |
          TAG_VERSION="${TARGET_TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TARGET_TAG does not match package.json version $PKG_VERSION — bump package.json first, or dispatch with the matching tag."
            exit 1
          fi

      - name: Test
        run: npx vitest run

      - name: Build the .deb
        run: bash scripts/package-linux.sh

      # Signed here, not at publish time, and over the file under its FINAL
      # name — the rename is what the landing page's stable
      # .../download/Alacran.deb link depends on, and a signature is over
      # bytes, so signing before the rename would still be correct but signing
      # after keeps the .sig sitting next to exactly what gets uploaded.
      #
      # Fails the whole release if the secret is missing rather than
      # publishing unsigned. That is the safe direction now: since
      # lib/updates/perform-linux-update-impl.ts refuses anything unsigned,
      # an unsigned release is not a slightly-worse release, it is one no
      # installed copy can update to. Better to break the release here, where
      # one person sees it, than in every user's app.
      - name: Sign the .deb
        env:
          ALACRAN_SIGNING_KEY: ${{ secrets.ALACRAN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ALACRAN_SIGNING_KEY:-}" ]; then
            echo "::error::ALACRAN_SIGNING_KEY is not set. Every published release must be signed — installed copies refuse unsigned updates outright. Add the private key as a repo secret and re-run."
            exit 1
          fi
          cp "$(ls dist/*.deb)" "Alacran.deb"
          node scripts/sign-release.mjs Alacran.deb

      # PERMANENT, despite arriving as a stopgap. A failed publish used to
      # take the built .deb down with it, so every tag from v0.25.0 to v0.55.0
      # built a perfectly good package on the one platform that can build it
      # and then threw it away — which is why those releases were assembled by
      # hand. RELEASES_REPO_TOKEN was fixed on 2026-09-06 (Contents: Read and
      # write) and the publish step below works again, so the original reason
      # for this step is gone.
      #
      # It stays anyway. This is what let v0.56.0 ship at all on the day the
      # token was still wrong: the .deb was recovered from here with
      # `gh run download` and attached by hand, and the publish step went green
      # on a re-run afterwards. The step costs one upload and nothing else, and
      # the failure it insures against is not hypothetical — it is the exact
      # thing that happened on this repo for thirty releases. Deleting it
      # because the token currently works is how it fails to exist on the day
      # the token expires, gets revoked, or is rotated wrong again.
      - name: Keep the .deb as a downloadable artifact
        # A SALVAGE COPY, never a gate. v0.70.0: this step hit "Artifact
        # storage quota has been hit", and because a failed step fails the
        # job, "Publish to alacran-releases" below was SKIPPED. The .deb had
        # already built and signed cleanly (steps 8-9) and was thrown away
        # with the runner, so the release went out carrying only the macOS
        # assets -- the exact "never publish a release missing an asset"
        # failure AGENTS.md warns about, caused by the convenience step meant
        # to protect against it. Its whole reason for existing is to help when
        # the publish fails; it must not be able to cause that.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Alacran-deb-${{ env.TARGET_TAG }}
          # The .sig too: a .deb salvaged from here and attached by hand is
          # useless to the updater without the signature beside it.
          path: |
            Alacran.deb
            Alacran.deb.sig
          if-no-files-found: error

      - name: Publish to alacran-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # No pre-check. Two have now been tried and both passed while the
          # publish failed one call later: `gh auth status` (v0.27.0 — a
          # fine-grained token authenticates fine with no Contents access) and
          # a GET on /releases (v0.27.1 — Contents: READ answers that happily,
          # and only the POST is refused). There is no harmless write to probe
          # with, and /repos/<repo>'s own `permissions` block describes the
          # ACCOUNT's access rather than the token's, so it reports push:true
          # throughout. Attempt the real thing and explain the failure instead:
          # the same reason the Linux display check is read off stderr rather
          # than guessed at up front.
          #
          # `gh release view` exits non-zero on 403 exactly as it does on a
          # missing release, so a token that cannot read falls through to
          # `create` — which is why the error below names both possibilities
          # rather than claiming to know which.
          if gh release view "$TARGET_TAG" --repo kwakuoseikwakye/alacran-releases >/dev/null 2>&1; then
            publish() { gh release upload "$TARGET_TAG" "Alacran.deb" "Alacran.deb.sig" --repo kwakuoseikwakye/alacran-releases --clobber; }
          else
            publish() { gh release create "$TARGET_TAG" "Alacran.deb" "Alacran.deb.sig" --repo kwakuoseikwakye/alacran-releases --title "Alacrán $TARGET_TAG"; }
          fi
          if ! publish; then
            echo "::error::Publishing to kwakuoseikwakye/alacran-releases failed. The .deb built fine and is attached to this run as an artifact, so nothing needs rebuilding — download it from the Artifacts section and attach it to the release, or fix the token and re-run this workflow. If the error above is 'HTTP 403: Resource not accessible by personal access token', RELEASES_REPO_TOKEN needs Contents: READ AND WRITE on that repo specifically; Contents: read passes every check that doesn't actually publish."
            exit 1
          fi
