name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to the same PR cancels the first run — nothing here is
# order-dependent, and a stale run's green check is worse than no check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` cannot be used here, and this is not laziness — it's the same
      # constraint package-linux.yml already documents. package-lock.json is
      # generated on macOS, where npm never resolves the wasm32-wasi optional
      # variant's own subtree, so the lock is permanently missing
      # @emnapi/core and @emnapi/runtime. `npm ci` requires an exact match and
      # hard-fails on Linux; `npm install` reconciles. Regenerating the lock
      # with --package-lock-only, with or without --os=linux --cpu=x64, does
      # not add them — both were tried against npm 11.6.2.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `next build` type-checks as part of the build, which is why there is no
      # standalone `tsc --noEmit` step here: on a fresh checkout that fails,
      # because next-env.d.ts (which declares the static-image-import types) is
      # gitignored and only generated by an actual Next.js command.
      - name: Build
        run: npm run build
