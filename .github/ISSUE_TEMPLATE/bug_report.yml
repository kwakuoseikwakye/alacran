name: Bug report
description: Something doesn't work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. A reproduction is worth more than a
        description — if you can get it down to steps someone else can follow,
        it will get fixed much faster.

        **Found a security problem?** Don't file it here. See
        [SECURITY.md](https://github.com/kwakuoseikwakye/alacran/blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a company at /tmp/test-co from the General pack
        2. Open Skills → digest → Run
        3. …
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - macOS .dmg
        - Linux .deb
        - Built from source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version in the update banner, or the commit SHA if you built from source.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.2 (Apple Silicon) / Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Which agent CLI is the company using?
      options:
        - Claude Code
        - OpenAI Codex
        - Aider
        - Not relevant to this bug
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: >
        Anything from the in-app log tail, or the terminal if you ran from
        source. **Check it for anything private before pasting** — company
        names, file paths and prompt text can end up in here.
      render: shell
