# Verify — the verification engine + sanitize gate + secret scan + the verifier's own tests
#
# This template's CI gate. 4 stages:
#   1. rqt         — runs the RQTs via scripts/verify.py (functional verification)
#   2. sanitize    — the G1-G4 sanitize gates (detects leaked confidential data)
#   3. secret-scan — gitleaks (credential detection, a substitute for GHAS on a private repo without it)
#   4. test-verify — the unittest suite under tests/ catches regressions in verify.py itself (no fake green applies to the verifier too)
#
# Register the job names "rqt" / "sanitize" / "secret-scan" / "test-verify" as required
# checks in branch protection.

name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rqt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: verify.py (the RQT gate — a FAIL means exit 1)
        run: |
          if [ -f scripts/verify.py ]; then
            python3 scripts/verify.py
          else
            echo "scripts/verify.py not yet set up (planned for Phase B-3). Skipping."
          fi

  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: G1 — detect PII (real names, emails, GitHub IDs)
        run: |
          # Participants may customize this gate for their own company once they start using it
          # for real (at template-distribution time it only checks a fixed set of names)
          if grep -rniE "kenken|syn\.ken|@gmail\.com" --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github .; then
            echo "::error::G1 FAIL — PII detected"
            exit 1
          fi
          echo "G1 PASS"
      - name: G2 — detect own infrastructure/brand terms
        run: |
          if grep -rniE "aidreams-factory|ai-company-prod|customercloud|customer\.cloud|カスタマークラウド|op://" --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github .; then
            echo "::error::G2 FAIL — infrastructure/brand term detected"
            exit 1
          fi
          echo "G2 PASS"
      - name: G3 — detect hardcoded home-directory paths
        run: |
          if grep -rnE "/Users/[a-z]+|~/\.ccagi|~/dev" --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github .; then
            echo "::error::G3 FAIL — home-directory path detected"
            exit 1
          fi
          echo "G3 PASS"
      - name: G4 — detect leftover external SDK references (HITL-3 compliance)
        run: |
          # excludes workflows (.github) + .gitignore, since those contain the defensive exclusion patterns themselves
          if grep -rniE "ccagi|skill_execute|agent_run\(|pipeline_run|cci_query" --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github --exclude=.gitignore .; then
            echo "::error::G4 FAIL — leftover external SDK reference detected"
            exit 1
          fi
          echo "G4 PASS"

  test-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: verify.py's own regression tests (Issue #42, stdlib unittest only)
        run: python3 -m unittest discover -s tests -v

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # gitleaks-action needs PR read to enumerate commits + issue comment for advisory
    # On a repo under an org, GITLEAKS_LICENSE (secrets.GITLEAKS_LICENSE) is mandatory.
    # It's available for free (get one at gitleaks.io). Register it in the org's repo secrets,
    # then add GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} to the env block of the
    # gitleaks step below (not needed under a personal account. See README.md's security
    # operations section. Issue #52)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (a substitute for secret scanning on a private repo without GHAS)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
