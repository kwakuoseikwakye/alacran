name: 🔧 ツール摩擦の報告 (verify.py / commands / hooks)
description: scripts/verify.py, .claude/commands/*, .claude/hooks/* で発生した予期しない挙動やエラー
title: "[feedback:tool-friction] "
labels: ["feedback:tool-friction"]
body:
  - type: markdown
    attributes:
      value: |
        ツールが期待通りに動かなかったケースを教えてください。エラーメッセージや再現手順を含めると解決が早いです。
  - type: input
    id: tool-name
    attributes:
      label: 対象ツール
      placeholder: "例: scripts/verify.py、/create-epic、.claude/hooks/git-ops-validator.sh"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 実行環境
      placeholder: |
        - OS: (例: macOS 14.5, Ubuntu 22.04, Windows 11 WSL2)
        - python3 --version:
        - git --version:
        - gh --version:
        - claude --version:
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. `git clone ...`
        2. `python3 scripts/verify.py`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 期待した挙動 / 実際の挙動
      placeholder: |
        期待: verify.py が PASS で exit 0
        実際: `ModuleNotFoundError: No module named 'yaml'` で exit 1
    validations:
      required: true
  - type: dropdown
    id: workaround
    attributes:
      label: 回避策の有無
      options:
        - 回避策あり (詳細を下に)
        - 回避策なし
        - 未検討
      default: 2
