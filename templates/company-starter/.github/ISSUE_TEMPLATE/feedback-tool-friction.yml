name: 🔧 Report tool friction (verify.py / commands / hooks)
description: Unexpected behavior or errors from scripts/verify.py, .claude/commands/*, .claude/hooks/*
title: "[feedback:tool-friction] "
labels: ["feedback:tool-friction"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us about a case where a tool didn't work as expected. Including the error message and reproduction steps speeds up resolution.
  - type: input
    id: tool-name
    attributes:
      label: Target tool
      placeholder: "e.g. scripts/verify.py, /create-epic, .claude/hooks/git-ops-validator.sh"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Execution environment
      placeholder: |
        - OS: (e.g. macOS 14.5, Ubuntu 22.04, Windows 11 WSL2)
        - python3 --version:
        - git --version:
        - gh --version:
        - claude --version:
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. `git clone ...`
        2. `python3 scripts/verify.py`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected behavior / actual behavior
      placeholder: |
        Expected: verify.py PASSes with exit 0
        Actual: exits 1 with `ModuleNotFoundError: No module named 'yaml'`
    validations:
      required: true
  - type: dropdown
    id: workaround
    attributes:
      label: Is there a workaround
      options:
        - Yes, there's a workaround (details below)
        - No workaround
        - Haven't looked into it
      default: 2
