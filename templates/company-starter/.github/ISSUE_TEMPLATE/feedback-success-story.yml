name: 🎉 成功事例のシェア
description: テンプレを使ってうまくいった話 — 改善のヒントになります
title: "[feedback:success-story] "
labels: ["feedback:success-story"]
body:
  - type: markdown
    attributes:
      value: |
        テンプレのどこがどう役に立ったかを教えてください。
        **自社機密は含まないよう抽象化してください** (「顧客 A の課題」ではなく「B2B SaaS の顧客成功課題」等)。
        許可なく公開できないケースは、事務局への直接連絡を推奨します。
  - type: textarea
    id: context
    attributes:
      label: 状況 (抽象化して)
      placeholder: 業種・規模・課題を機密なしで一般化
    validations:
      required: true
  - type: input
    id: which-part
    attributes:
      label: テンプレのどの部分が役に立ちましたか
      placeholder: "例: /define-company の 4 質問構造、HITL Gate の trigger table、verify.py の RQT 追加パターン"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 何が改善しましたか
      placeholder: 定量 (時間短縮 %、Issue 処理数、etc.) or 定性 (意思決定の速度、チームの共通言語、etc.)
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開同意
      options:
        - label: この事例をテンプレの CHANGELOG や事例集で紹介してよい (asked with owner)
