name: 🎉 Share a success story
description: A story about something that went well with the template — useful as a hint for improvement
title: "[feedback:success-story] "
labels: ["feedback:success-story"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us where and how the template helped.
        **Please abstract away your own company's confidential details** (e.g. "a B2B SaaS
        customer-success issue" rather than "customer A's issue").
        If you can't publish something without permission, we recommend contacting the
        organizers directly instead.
  - type: textarea
    id: context
    attributes:
      label: Situation (abstracted)
      placeholder: Generalize the industry, scale, and issue with no confidential details
    validations:
      required: true
  - type: input
    id: which-part
    attributes:
      label: Which part of the template helped
      placeholder: "e.g. /define-company's 4-question structure, the HITL Gate trigger table, the pattern for adding an RQT to verify.py"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What improved
      placeholder: Quantitative (% time saved, Issues processed, etc.) or qualitative (decision speed, a shared team vocabulary, etc.)
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent to publish
      options:
        - label: This story may be featured in the template's CHANGELOG or case-study collection (asked with owner)
