name: 📝 Feedback on the template's content
description: Opinions/suggestions about the content of CLAUDE.md / rules / commands / docs / templates
title: "[feedback:content] "
labels: ["feedback:content"]
body:
  - type: markdown
    attributes:
      value: |
        Please send feedback about the content of the template itself.
        Don't include your own company's confidential details — abstract them away before filing.
  - type: input
    id: file-path
    attributes:
      label: Target file (path from repo root)
      placeholder: "e.g. CLAUDE.md, docs/starter-manual.md, .claude/rules/hitl-gate.md"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Where the current text was confusing or caused trouble
      placeholder: Which text, in what context, and why it was a problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you'd like it improved (proposal)
      placeholder: A concrete wording diff, or a proposal for a section to add
  - type: dropdown
    id: severity
    attributes:
      label: Impact
      options:
        - critical (stops the retreat from proceeding)
        - high (confuses 30%+ of participants)
        - medium (may just be me, but it was a problem)
        - low (nice-to-have)
      default: 2
    validations:
      required: true
