name: 📖 Report a documentation gap
description: Point out something that "should be documented here but isn't"
title: "[feedback:doc-gap] "
labels: ["feedback:doc-gap"]
body:
  - type: markdown
    attributes:
      value: |
        Please report "I looked for it but couldn't find it" or "I thought it would be here, but it wasn't".
  - type: input
    id: search-context
    attributes:
      label: What were you looking for
      placeholder: "e.g. the list of /verify options, a concrete HITL Gate example, the difference in prerequisite tools on Windows"
    validations:
      required: true
  - type: textarea
    id: where-looked
    attributes:
      label: Where did you look (in the order you looked)
      placeholder: |
        1. README.md
        2. docs/starter-manual.md
        3. .claude/commands/verify.md
    validations:
      required: true
  - type: input
    id: expected-location
    attributes:
      label: Where did you think it should be documented
      placeholder: "e.g. the Troubleshooting section of docs/setup-walkthrough.md"
