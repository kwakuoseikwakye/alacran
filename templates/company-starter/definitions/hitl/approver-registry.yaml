# =============================================================================
# Approver registry template (approver-registry)
# =============================================================================
# The SSOT that maps a HITL trigger's (definitions/hitl/triggers/*.yaml) approver_role
# onto an "actual, real approver". The trigger side only references a role name (role) —
# who actually approves it can then be updated just by editing this one file.
#
# Filled-in example: examples/harukaze-ec/definitions/hitl/approver-registry.yaml
# The thinking behind an approval SPOF (a single approver stopping everything):
# docs/concepts/hitl-async-approval.md
# =============================================================================

version: 1
schema_version: "<<TODO: YYYY-MM-DD>>"

# ------------------------------------------------------------
# A. Approvers (persons) — don't write real names; stick to a role label and a GitHub handle
# ------------------------------------------------------------
persons:
  - id: person-001
    display_name: "<<TODO: e.g. Owner (sole)>>"   # a role label. Don't write a personal name
    status: active
    github_handle: "<<TODO: github username>>"     # the destination for github_label notifications

# ------------------------------------------------------------
# B. Role → approver (role_assignments)
# ------------------------------------------------------------
# A trigger yaml's approver_role corresponds to a role name here.
# At a company with only one approver, it's fine to honestly map every role to that same
# person (see the sole-owner rule below).
role_assignments:
  owner: person-001
  # finance: person-001
  # on-call: person-001

# ------------------------------------------------------------
# C. Deputy approvers (deputy_assignments)
# ------------------------------------------------------------
# The sole-owner degradation rule: when there is only one approver, honestly write the deputy
# as "vacant". Not pretending a second person exists is the starting point for addressing the
# SPOF. Update this once a second person actually joins.
deputy_assignments:
  owner: vacant
  # finance: vacant
  # on-call: vacant

# ------------------------------------------------------------
# D. Sole-owner mode degradation rules (degradation_rules)
# ------------------------------------------------------------
# When the approver and the deputy resolve to the same person (i.e. effectively just one
# person), this spells out how to degrade behavior per severity. critical / high must never
# compromise on "never auto-approve".
sole_owner_mode: true               # true if the approver is effectively just one person

degradation_rules:
  critical:
    on_timeout: hold_item_only      # hold only the item in question (other tasks continue)
    auto_approve: forbidden         # auto-approval of critical is forbidden
  high:
    on_timeout: hold_item_only
    auto_approve: forbidden         # auto-approval of high is also forbidden
  medium:
    on_timeout: auto_approve_with_log  # for medium only, allow auto-approval while logging it
    auto_approve: allowed_with_log

  # The degradation policy to prevent "the whole company grinds to a halt" when no approver
  # is available: hold only the items awaiting approval; don't stop the entire cycle for
  # other tasks that don't need approval.
  item_isolation:
    hold_scope: item_only
    suspend_whole_cycle: false
