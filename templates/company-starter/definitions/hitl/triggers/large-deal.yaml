# =============================================================================
# HITL trigger template — large-deal gate (large-deal)
# =============================================================================
# A trigger to insert approval so the AI never finalizes a deal or expenditure above a
# certain amount on its own. See definitions/hitl/triggers/_schema.md for how to write one.
# Replace <<TODO>> with your own company's values. Filled-in example:
#   examples/harukaze-ec/definitions/hitl/triggers/large-deal.yaml
# =============================================================================

version: 1
id: large-deal
name: Large-deal gate
severity: high                      # a large financial impact -> high (auto-approval is forbidden)

description: |
  Requires approval from a human with decision-making authority before the AI finalizes,
  on its own, any purchase order, quote, discount, or payment-terms change above a certain
  amount.

fire_when:
  - when: "A purchase order/expenditure amount is at or above the approval threshold"
    condition: "<<TODO: e.g. order.amount_band in [30k_100k, over_100k]>>"
  - when: "A discount at or above a certain percentage"
    condition: "<<TODO: e.g. deal.discount_pct >= 20>>"
  - when: "A term change affecting cash flow, such as extending payment terms"
    condition: "<<TODO: e.g. deal.payment_terms_days > 60>>"

approver_role: "<<TODO: e.g. owner / finance>>"   # corresponds to a role in approver-registry.yaml
notify: github_label
notify_label: "hitl:large-deal"
on_timeout: hold_item_only          # only the deal in question is held on timeout (other tasks continue)

auto_proceed: false                 # always false for high

examples:
  - "<<TODO: e.g. a purchase order of $3,000 or more>>"
  - "<<TODO: e.g. a request for a 25% discount on an existing contract>>"
