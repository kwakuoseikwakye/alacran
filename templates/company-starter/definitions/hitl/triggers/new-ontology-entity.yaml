# =============================================================================
# HITL trigger template — new ontology entity gate (new-ontology-entity)
# =============================================================================
# A trigger to insert review when adding a new "type" of entity / event / relation to
# definitions/ontology/. The ontology is the company's "canon", so this guards against
# unchecked proliferation. See _schema.md for how to write one. Replace <<TODO>> with your
# own company's values.
# =============================================================================

version: 1
id: new-ontology-entity
name: New ontology entity gate
severity: high                      # a change to the SSOT structure -> high (new types are never auto-approved)

description: |
  Requires review by the person in charge when adding a new entity type / event type /
  relation type, or a new domain, to the ontology (definitions/ontology/).
  A minor addition of an optional field to an existing entity may be treated as low-risk
  (see §auto_proceed).

fire_when:
  - when: "Establishing a new entity / event / relation type"
    condition: "<<TODO: e.g. ontology.change_kind == new_type>>"
  - when: "Adding a new domain yaml"
    condition: "<<TODO: e.g. ontology.change_kind == new_domain>>"
  - when: "A change that breaks backward compatibility with the existing schema"
    condition: "<<TODO: e.g. ontology.breaking_change == true>>"

approver_role: "<<TODO: e.g. owner>>"   # corresponds to a role in approver-registry.yaml
notify: github_label
notify_label: "hitl:ontology"
on_timeout: re_notify               # SSOT changes never auto-proceed (re-notify via another channel)

# A minor change that "doesn't add a new type" (e.g. adding an optional field to an existing
# entity) may be downgraded to medium-equivalent and conditionally auto-approved (new types /
# new domains / breaking changes are out of scope for this — they keep the high severity above).
auto_proceed: false                 # defaults to false. Only minor changes may be conditionally allowed operationally

examples:
  - "<<TODO: e.g. adding a partner entity type to the customer domain>>"
  - "<<TODO: e.g. establishing a new supplier.yaml domain>>"
