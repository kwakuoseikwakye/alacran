# =============================================================================
# HITL trigger template — incident-response gate (incident)
# =============================================================================
# A trigger to insert immediate human approval for situations that become serious if
# handled wrong — outages, customer impact, data loss, security. See _schema.md for how
# to write one. Replace <<TODO>> with your own company's values.
# =============================================================================

version: 1
id: incident
name: Incident-response gate
severity: critical                  # company-survival level -> critical (auto-approval is forbidden)

description: |
  Requires immediate human approval for situations where a wrong response is unrecoverable:
  a high-severity outage, impact to customer data, suspected security breach, runaway costs,
  and the like.

fire_when:
  - when: "A high-severity outage has occurred"
    condition: "<<TODO: e.g. incident.severity in [P0, P1]>>"
  - when: "Customers are being affected"
    condition: "<<TODO: e.g. incident.affected_customers > 0>>"
  - when: "Suspected data loss"
    condition: "true"               # data loss fires unconditionally
  - when: "Suspected security breach"
    condition: "true"

approver_role: "<<TODO: e.g. owner / on-call>>"   # corresponds to a role in approver-registry.yaml
notify: manual                      # confirm immediately given the urgency (chat/verbally to the person in charge)
on_timeout: escalate                # escalate to a senior/deputy approver if there's no response in time

auto_proceed: false                 # always false for critical

examples:
  - "<<TODO: e.g. a full outage of the production service>>"
  - "<<TODO: e.g. accidental public exposure of customer data>>"
  - "<<TODO: e.g. an unexpected spike in usage-based billing>>"
