    high_alert: "<<TODO_team_kpi_1_high_alert>>"
    target_steady_state: "<<TODO_target>>"
  notification:
    low: <<TODO_notify_low>>                        # github_label / manual / null
    high: <<TODO_notify_high>>
  data_source: <<TODO_data_source>>                # cycle_log + an industry-specific source
  audit_format: |
    {"<<TODO_team_kpi_1_name>>": <value>}

# --- Team-specific KPI #2 ---
<<TODO_team_kpi_2_name>>:
