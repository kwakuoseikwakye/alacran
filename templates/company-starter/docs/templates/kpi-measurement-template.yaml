# =============================================================================
# Weekly digest
# =============================================================================
weekly_digest:
  description: "The KPI dashboard generated at the point of the weekly retrospective"
  format: markdown
  output_path: "docs/retros/<<TODO_team_id>>/weekly/{YYYY-Www}.md"
  generated_at: "<<TODO_digest_time>>"             # e.g. "Friday 17:00 JST"
  contents:
    - "A results-vs-target table for every KPI"
    - "A summary of threshold-breach alerts"
    - "The last 4 cycles' moving-average trend"
    - "Recommended actions for the next cycle"

# =============================================================================
# Checklist for filling it in (applies to the instance created by copying this template)
# =============================================================================
acceptance_criteria:
  - "team_id makes the team explicit"
  - "measurement_infrastructure has all 3 of collection_window + data_sources + notification"
  - "The 2 common KPIs (cycle_completion_rate / hitl_intervention_rate) are present"
  - "2 or more team-specific KPIs, each with the 7 fields (description / target / measurement_formula / threshold / notification / data_source / audit_format)"
  - "The notification method is one of github_label / manual / null"
  - "Every <<TODO_*>> is filled in (any that remain are detected by scripts/verify.py's DEF-KPI-01)"
  - "The yaml syntax is valid"

