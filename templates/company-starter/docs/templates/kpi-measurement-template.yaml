# =============================================================================
# Template — the source for definitions/kpi/<team>-kpi.yaml
# =============================================================================
# The starting point for standing up a team/department's KPI measurement specification.
# This file itself is not live. Copy it and fill it in.
#
# Explanation of the common skeleton: docs/templates/common-kpi-pattern.yaml
# Filled-in example:                  examples/harukaze-ec/definitions/kpi/ec-team-kpi.yaml
# Related:                            docs/templates/cycle-plan-template.yaml /
#                                      docs/templates/retrospective-template.yaml
#
# How to use:
# 1. Copy this file to definitions/kpi/<team>-kpi.yaml
# 2. Replace every <<TODO_*>> with your own company's values
# 3. The 2 common KPIs (cycle_completion_rate / hitl_intervention_rate) are mandatory
# 4. Add 2 or more team-specific KPIs
# 5. Standardize on github_label / manual for the notification method (whatever your
#    company can actually operate)
# =============================================================================

version: 1
schema_version_meta: "<<TODO_YYYY-MM-DD>>"
status: draft
team_id: <<TODO_team_id>>                          # e.g. ec-team (matches org.team's team_id)

# =============================================================================
# Measurement infrastructure
# =============================================================================
measurement_infrastructure:
  collection_window:
    cycle_start: "<<TODO_cycle_start>>"            # e.g. "Monday 00:00 JST"
    cycle_end: "<<TODO_cycle_end>>"                # e.g. "Sunday 23:59 JST"
    duration_hours: <<TODO_duration>>              # weekly: ~167 / monthly: ~720
    measurement_finalize: "<<TODO_finalize>>"      # e.g. "Sunday 22:00 JST"

  data_sources:
    cycle_log:
      path: "state/cycles/<<TODO_team_id>>/<YYYY-MM-DD>/cycle.jsonl"
      format: jsonl
      writer: "The cycle-operations script (cycle-event)"
      retention: "Kept in git for the entire history"
    # Add an industry-specific data source (e.g. an order-export CSV / an inquiry log)
    <<TODO_industry_data_source>>:
      path: "<<TODO_path>>"
      format: <<TODO_format>>                      # jsonl / csv
      writer: "<<TODO_writer>>"
      retention: "Kept in git for the entire history"

  notification:
    channels:
      - id: github_label
        use_for: "A warning-level alert (labels an Issue to notify the person in charge)"
      - id: manual
        use_for: "A critical alert (confirm immediately with the person in charge via chat/verbally)"

# =============================================================================
# KPI definitions
# =============================================================================
# The 2 common KPIs (cycle_completion_rate / hitl_intervention_rate) are mandatory.
# Add 2 or more team-specific KPIs. Each KPI needs description / target /
# measurement_formula / threshold / notification / data_source / audit_format.

# --- Common KPI #1: cycle completion rate ---
cycle_completion_rate:
  description: "The proportion of cycles where every phase completed by its deadline"
  target: 0.95
  measurement_formula: |
    completed_cycles / total_cycles
    completed_cycles = count(event.type == "cycle_completed" in cycle.jsonl)
    total_cycles     = count(event.type == "cycle_started")
  threshold:
    low_alert: "< 0.80 for 3 consecutive cycles"
    high_alert: null
    target_steady_state: ">= 0.95"
  notification:
    low: github_label
    high: null
  data_source: cycle_log
  audit_format: |
    {"cycle_completion_rate": <float>, "completed": <int>, "total": <int>}

# --- Common KPI #2: human-approval intervention rate ---
hitl_intervention_rate:
  description: "The proportion of all tasks that went through a human approval gate (lower = more autonomous)"
  target: <<TODO_hitl_target>>                     # ~0.20-0.30, varies by team
  measurement_formula: |
    hitl_invoked / total_tasks
    hitl_invoked = count(event.type == "hitl_gate_fired")
    total_tasks  = count(event.type == "task_executed")
  threshold:
    low_alert: "> <<TODO_hitl_escalation>> for 3 consecutive cycles"  # e.g. 0.35
    high_alert: null
    target_steady_state: "<= <<TODO_hitl_target>>"
  notification:
    low: manual
    high: null
  data_source: cycle_log
  audit_format: |
    {"hitl_intervention_rate": <float>, "invoked": <int>, "total": <int>}

# --- Team-specific KPI #1 ---
# e.g. EC conversion rate / inquiry response time / on-time delivery rate
<<TODO_team_kpi_1_name>>:
