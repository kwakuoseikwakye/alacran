# Ontology Starter Template — 最小 3 domain (customer + org + product)
# 自社オントロジー (事業構造の宣言的定義) を書き始めるための出発点。
#
# 使い方:
#   1. 本ファイルを `definitions/ontology/company.yaml` にコピー
#      (`/define-company` コマンドで対話生成する場合はこの手順を自動化)
#   2. 必要に応じて customer.yaml / org.yaml / product.yaml に分割
#   3. 業種固有 entity を attributes に追加 (例: 社労士なら labor_contract、EC なら sku)
#   4. HITL Gate (`.claude/rules/hitl-gate.md`) の承認手順を踏んでから commit
#
# 設計原則:
#   - 業種非依存 (どの業種でも適用可)
#   - 最小開始 (workspace/task/schedule 等の domain は必要になってから追加)
#   - 命名規約 = lowercase + ドット区切り (例: customer.account)

version: 1
schema_version: "2026-06-30-template"
template_origin: docs/templates/ontology-starter.yaml
status: template

# ============================================================
# Domain 1: customer (顧客)
# ============================================================
customer:
  domain: customer
  primary_owner_candidates:
    - 営業担当 / SalesAgent
    - 顧客対応チーム
    - 社内オーケストレーター（CoordinatorAgent）

  entities:
    - id: customer.account
      type: account
      name: 顧客アカウント
      description: 顧客企業 / 個人 / 政府機関。契約主体。
      attributes:
        name: string
        industry: string  # 例: finance / healthcare / saas / labor_consulting / ec / manufacturing
        employee_count: integer
        country: string
        tier: enum  # poc / pilot / production / strategic
        acquisition_channel: enum  # inbound / outbound / referral / partner / event
        first_contact_at: datetime
      tags: [primary, gtm-target]

    - id: customer.contact
      type: person
      name: 顧客担当者
      description: 顧客企業内の窓口・意思決定者。
      attributes:
        name: string
        role: string
        email: string
        phone: string
        decision_authority: enum  # final / influencer / user / blocker
        preferred_channel: enum  # slack / email / call / chat
      tags: [primary]

    - id: customer.contract
      type: contract
      name: 契約
      description: 顧客との金銭契約。単発 / 継続 / 成果報酬などの混合可。
      attributes:
        contract_type: enum  # one_time / recurring / outcome / hybrid
        acv: number  # Annual Contract Value
        currency: enum  # JPY / USD / EUR
        start_date: date
        end_date: date
        status: enum  # draft / active / suspended / churned
      tags: [primary]

# ============================================================
# Domain 2: org (社内組織)
# ============================================================
org:
  domain: org
  primary_owner_candidates:
    - CoordinatorAgent
    - HRAgent (Phase 5+)

  entities:
    - id: org.role
      type: role
      name: 役割
      description: 社内の職務役割。人 (employee) と agent の両方に割当可能。
      attributes:
        name: string
        description: string
        responsibilities: list
        authority_level: enum  # executive / manager / senior / junior / contractor
      tags: [primary]

    - id: org.employee
      type: person
      name: 従業員
      description: 人間スタッフ。agent と協働。
      attributes:
        name: string
        email: string
        role_ids: list  # ref: org.role
        timezone: string
        languages: list
        joined_at: date
        status: enum  # active / leave / left
      tags: [primary]

    - id: org.team
      type: team
      name: チーム
      description: 機能単位のチーム（運用チーム / 製品チーム等）。
      attributes:
        name: string
        purpose: string
        member_employee_ids: list
        member_agent_ids: list  # ref: agent skeleton
        lead_employee_id: string
      tags: [secondary]

# ============================================================
# Domain 3: product (製品 / サービス)
# ============================================================
product:
  domain: product
  primary_owner_candidates:
    - 商品企画担当 / ProductAgent
    - 各製品の運用担当

  entities:
    - id: product.offering
      type: offering
      name: 提供物
      description: 販売対象となる product / service。
      attributes:
        name: string
        kind: enum  # saas / fde_engagement / consulting / hybrid
        pricing_model: enum  # one_time / monthly / annual / usage / outcome
        target_customer_segments: list  # ref: customer.account.tier
        launch_date: date
        status: enum  # alpha / beta / ga / sunset
      tags: [primary]

    - id: product.feature
      type: feature
      name: 機能
      description: offering 内の個別機能単位。
      attributes:
        name: string
        offering_id: string  # ref: product.offering
        description: string
        availability: enum  # all_tiers / premium_only / experimental
      tags: [secondary]

# ============================================================
# Domain 別追加候補（業種別）
# ============================================================
# 本テンプレには含めないが、必要に応じて追加:
#
# Domain 追加候補:
#   - partner (外部パートナー — 仕入先・媒体・代理店網など。事業の中心に外部主体がいる業種で追加)
#
# 運用系の追加候補:
#   - hitl_gate_event (承認ゲート発火イベントの記録)
#   - cycle_event (業務サイクルの周期記録)
#
# 業種別例:
#   専門サービス: engagement / session / case（案件）
#   EC:          sku / order / inventory_alert
#   製造:        production_line / quality_incident / equipment_maintenance
#
# 追加手順:
#   1. 該当 domain.yaml に entities[] エントリ追加
#   2. HITL Gate (.claude/rules/hitl-gate.md) で承認要否を確認
#   3. 新しい「型」の追加は new-ontology-entity トリガーの承認を通す
#   4. scripts/verify.py で ONTOLOGY-01（YAML 構文）PASS を確認

# ============================================================
# Template Acceptance
# ============================================================
template_acceptance:
  - 3 domain (customer + org + product) 定義
  - 各 domain に primary + secondary entity 計 8 件
  - 命名規約 = lowercase + ドット区切り遵守
  - 業種別追加候補をコメントで明示
  - 業種固有 entity をテンプレ本体に含めない (中立性保持)
