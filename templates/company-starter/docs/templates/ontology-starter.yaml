# Ontology Starter Template — a minimal 3 domains (customer + org + product)
# The starting point for writing your own company ontology (the declarative definition of
# your business structure).
#
# How to use:
#   1. Copy this file to `definitions/ontology/company.yaml`
#      (automated by the `/define-company` command if generating interactively)
#   2. Split into customer.yaml / org.yaml / product.yaml if needed
#   3. Add industry-specific entities to attributes (e.g. labor_contract for a labor
#      consultant, sku for an EC company)
#   4. Commit only after going through the HITL Gate (`.claude/rules/hitl-gate.md`)
#      approval procedure
#
# Design principles:
#   - Industry-agnostic (applies to any industry)
#   - Start minimal (add domains like workspace/task/schedule only once you actually need them)
#   - Naming convention = lowercase + dot-separated (e.g. customer.account)

version: 1
schema_version: "2026-06-30-template"
template_origin: docs/templates/ontology-starter.yaml
status: template

# ============================================================
# Domain 1: customer
# ============================================================
customer:
  domain: customer
  primary_owner_candidates:
    - Sales rep / SalesAgent
    - Customer-support team
    - The in-house orchestrator (CoordinatorAgent)

  entities:
    - id: customer.account
      type: account
      name: Customer account
      description: A customer company / individual / government body. The contracting party.
      attributes:
        name: string
        industry: string  # e.g. finance / healthcare / saas / labor_consulting / ec / manufacturing
        employee_count: integer
        country: string
        tier: enum  # poc / pilot / production / strategic
        acquisition_channel: enum  # inbound / outbound / referral / partner / event
        first_contact_at: datetime
      tags: [primary, gtm-target]

    - id: customer.contact
      type: person
      name: Customer contact
      description: The point of contact / decision-maker inside the customer company.
      attributes:
        name: string
        role: string
        email: string
        phone: string
        decision_authority: enum  # final / influencer / user / blocker
        preferred_channel: enum  # slack / email / call / chat
      tags: [primary]

    - id: customer.contract
      type: contract
      name: Contract
      description: A monetary contract with a customer. May be one-time, recurring, outcome-based, or a mix.
      attributes:
        contract_type: enum  # one_time / recurring / outcome / hybrid
        acv: number  # Annual Contract Value
        currency: enum  # JPY / USD / EUR
        start_date: date
        end_date: date
        status: enum  # draft / active / suspended / churned
      tags: [primary]

# ============================================================
# Domain 2: org
# ============================================================
org:
  domain: org
  primary_owner_candidates:
    - CoordinatorAgent
    - HRAgent (Phase 5+)

  entities:
    - id: org.role
      type: role
      name: Role
      description: An in-house job role. Can be assigned to either a person (employee) or an agent.
      attributes:
        name: string
        description: string
        responsibilities: list
        authority_level: enum  # executive / manager / senior / junior / contractor
      tags: [primary]

    - id: org.employee
      type: person
      name: Employee
      description: A human staff member, working alongside agents.
      attributes:
        name: string
        email: string
        role_ids: list  # ref: org.role
        timezone: string
        languages: list
        joined_at: date
        status: enum  # active / leave / left
      tags: [primary]

    - id: org.team
      type: team
      name: Team
      description: A functional team (e.g. an operations team, a product team).
      attributes:
        name: string
        purpose: string
        member_employee_ids: list
        member_agent_ids: list  # ref: agent skeleton
        lead_employee_id: string
      tags: [secondary]

# ============================================================
# Domain 3: product
# ============================================================
product:
  domain: product
  primary_owner_candidates:
    - Product planning lead / ProductAgent
    - The person operating each product

  entities:
    - id: product.offering
      type: offering
      name: Offering
      description: The product / service being sold.
      attributes:
        name: string
        kind: enum  # saas / fde_engagement / consulting / hybrid
        pricing_model: enum  # one_time / monthly / annual / usage / outcome
        target_customer_segments: list  # ref: customer.account.tier
        launch_date: date
        status: enum  # alpha / beta / ga / sunset
      tags: [primary]

    - id: product.feature
      type: feature
      name: Feature
      description: An individual feature unit within an offering.
      attributes:
        name: string
        offering_id: string  # ref: product.offering
        description: string
        availability: enum  # all_tiers / premium_only / experimental
      tags: [secondary]

# ============================================================
# Candidate additional domains (by industry)
# ============================================================
# Not included in this template, but add as needed:
#
# Candidate domains to add:
#   - partner (an external partner — suppliers, media, agency networks, etc. Add this for an
#     industry where an external party sits at the center of the business)
#
# Candidate operational additions:
#   - hitl_gate_event (a record of approval-gate fire events)
#   - cycle_event (a periodic record of the business cycle)
#
# Examples by industry:
#   Professional services: engagement / session / case (a matter)
#   EC:                    sku / order / inventory_alert
#   Manufacturing:         production_line / quality_incident / equipment_maintenance
#
# How to add one:
#   1. Add an entities[] entry to the relevant domain.yaml
#   2. Check whether approval is needed via the HITL Gate (.claude/rules/hitl-gate.md)
#   3. Route the addition of a new "type" through the new-ontology-entity trigger's approval
#   4. Confirm ONTOLOGY-01 (YAML syntax) PASSes in scripts/verify.py

# ============================================================
# Template Acceptance
# ============================================================
template_acceptance:
  - Defines 3 domains (customer + org + product)
  - 8 primary + secondary entities total across the domains
  - Follows the naming convention = lowercase + dot-separated
  - Candidate additions by industry are called out in comments
  - Industry-specific entities are not included in the template body itself (keeps it neutral)
