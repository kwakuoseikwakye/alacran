# =============================================================================
# Template — the source for definitions/cycles/<team>-cycle-plan.yaml
# =============================================================================
# The starting point for standing up a team/department's business-cycle plan (granularity,
# phases, reviews, metrics, escalation). This file itself is not live. Copy it and fill it in.
#
# Filled-in example: examples/harukaze-ec/definitions/cycles/ec-team-cycle-plan.yaml
# Related:           docs/templates/kpi-measurement-template.yaml /
#                     docs/templates/retrospective-template.yaml
#
# How to use:
# 1. Copy this file to definitions/cycles/<team>-cycle-plan.yaml
# 2. Fill in every <<TODO_*>>, and make the team explicit via team_id
# 3. How to choose cycle_unit:
#    - monthly: month-end closing is the essence (accounting / billing / professional services)
#    - weekly:  weekly processes, fast order velocity (EC / manufacturing / inventory management)
#    - daily:   high-frequency transactions (CS / monitoring)
# 4. 3-4 cycle_phases is recommended
# 5. Keep hitl_gates consistent with the trigger ids in definitions/hitl/triggers/
# =============================================================================

version: 1
schema_version_meta: "<<TODO_YYYY-MM-DD>>"
status: draft
team_id: <<TODO_team_id>>                        # e.g. ec-team (matches org.team's team_id)

cycle_plan:
  # === The cycle's granularity ===
  cycle_unit: <<TODO_unit>>                      # monthly / weekly / daily
  cycle_calendar:
    cycle_start_day: <<TODO_start>>              # monthly: 1 / weekly: "Monday"
    cycle_close_day: <<TODO_close>>              # monthly: 31 / weekly: "Sunday"
    <<TODO_anchor_field>>: <<TODO_anchor_value>> # an industry-specific anchor
                                                  # e.g. sale_anchor_event: "weekend sale"
                                                  #      billing_anchor_day: 25

  # === The cycle's phases ===
  # 3-4 phases recommended. Each phase requires day_range / activities / hitl_gates.
  cycle_phases:
    - id: P-01
      name: "<<TODO_phase1_name>>"               # e.g. "Start-of-week prep + inventory adjustment"
      day_range: "<<TODO_range>>"                # e.g. "Mon-Tue"
      activities:
        - "<<TODO_activity_1>>"
        - "<<TODO_activity_2>>"
      hitl_gates: [<<TODO_hitl_gate>>]           # an id from definitions/hitl/triggers/

    - id: P-02
      name: "<<TODO_phase2_name>>"
      day_range: "<<TODO_range>>"
      activities:
        - "<<TODO_activity>>"
        - "<<TODO_activity>>"
      hitl_gates: [<<TODO_hitl_gate>>]

    - id: P-03
      name: "<<TODO_phase3_name>>"
      day_range: "<<TODO_range>>"
      activities:
        - "<<TODO_activity>>"
        - "<<TODO_activity>>"
      hitl_gates: [<<TODO_hitl_gate>>]

    # A 4th phase may not be needed depending on cycle_unit (weekly often fits in 3 phases)

  # === Quarterly review ===
  quarterly_review:
    schedule: "<<TODO_schedule>>"                # e.g. "the Monday of the last week of each quarter"
    participants:
      - "<<TODO_participant_1>>"                 # a role label (e.g. "store manager")
      - "<<TODO_participant_2>>"
    agenda:
      - "Review last quarter's approval-gate pass rate"
      - "<<TODO_industry_agenda_1>>"             # industry-specific (e.g. inventory turnover / on-time delivery rate)
      - "<<TODO_industry_agenda_2>>"
      - "Set next quarter's improvement backlog"

  # === Annual review ===
  annual_review:
    schedule: "<<TODO_annual_schedule>>"         # e.g. "fiscal year-end (last week of March)"
    activities:
      - "<<TODO_annual_activity_1>>"             # an annual wrap-up (industry-specific)
      - "<<TODO_annual_activity_2>>"
      - "Decide on adding/withdrawing from a scope of coverage or channel"

  # === Cycle metrics ===
  # The 2 common KPIs + 2 team-specific ones recommended (see kpi-measurement-template.yaml for KPI details)
  metrics:
    cycle_completion_rate:
      target: 0.95
      measurement: "All phases complete by cycle_close_day"
    hitl_intervention_rate:
      target: <<TODO_hitl_rate>>                 # e.g. 0.25
      escalation_threshold: <<TODO_threshold>>   # e.g. 0.35
    <<TODO_team_metric_1>>:
      target: <<TODO_target>>                    # a string like "<=1 per week" is also fine
      anomaly_threshold: <<TODO_threshold>>
    <<TODO_team_metric_2>>:
      target: <<TODO_target>>
      anomaly_threshold: <<TODO_threshold>>

  # === Escalation paths ===
  # At least 3 conditions recommended (cycle health + industry-specific + customer satisfaction)
  escalation_paths:
    - condition: "cycle_completion_rate < 0.80"
      action: "Approver review -> root-cause analysis and cycle redesign"
    - condition: "<<TODO_industry_condition>>"
      action: "<<TODO_industry_action>>"
    - condition: "<<TODO_satisfaction_condition>>"
      action: "<<TODO_satisfaction_action>>"

# =============================================================================
# Checklist for filling it in (applies to the instance created by copying this template)
# =============================================================================
acceptance_criteria:
  - "team_id makes the team explicit"
  - "cycle_unit is one of monthly / weekly / daily"
  - "3 or more cycle_phases, each with day_range / activities / hitl_gates all present"
  - "An industry-specific anchor exists in cycle_calendar"
  - "quarterly + annual review schedules are defined"
  - "metrics has the 2 common ones (cycle_completion_rate / hitl_intervention_rate) + 2 or more specific ones"
  - "3 or more escalation_paths, every condition has a corresponding action"
  - "Every <<TODO_*>> is filled in"

# Verification: python3 scripts/verify.py's DEF-CYCLE-01 (parses + zero remaining <<TODO + team_id present)
