# =============================================================================
# Cycle-execution log schema (cycle.jsonl) — a generic per-team cycle log
# =============================================================================
# The canonical schema for appending, as JSONL (one line = one event), the events that
# occur during a single business cycle. KPI measurement (definitions/kpi/) and
# retrospectives (definitions/retro/) both aggregate over this log.
#
# Authoritative storage location: state/cycles/<team-id>/<YYYY-MM-DD>/cycle.jsonl
#   - state/ is git-tracked (distinct from a .gitignore'd scratch area — this is a
#     persistent SSOT)
#   - <team-id> is org.team's team_id (e.g. ec-team)
#   - <YYYY-MM-DD> is the cycle's start date
#
# The cycle-operations script (scripts/cycle/) appends events following this schema.
# =============================================================================

version: 1
kind: cycle_execution_log_schema

# ------------------------------------------------------------
# Storage
# ------------------------------------------------------------
storage:
  path_template: "state/cycles/<team-id>/<YYYY-MM-DD>/cycle.jsonl"  # <...> are variables auto-substituted at runtime (distinct from a <<TODO_*>>-style fill-in placeholder)
  format: "JSONL (1 line = 1 event)"
  encoding: UTF-8
  append_only: true                 # existing lines are never rewritten (append only)
  git_tracked: true
  retention: "Kept in git for the entire history"

# ------------------------------------------------------------
# Fields common to every event
# ------------------------------------------------------------
common_fields:
  ts: "An ISO 8601 timestamp (e.g. 2026-07-06T00:00:01Z)"
  team_id: "org.team's team_id (e.g. ec-team)"
  cycle_id: "The cycle identifier (= its start date, e.g. 2026-07-06)"
  event_type: "The event kind (one of the event_types below)"
  sequence: "A running number within the cycle (monotonically increasing, order-guaranteed)"

# ------------------------------------------------------------
# Event kinds (the minimal set)
# ------------------------------------------------------------
# Companies may add their own kinds, but always keep these 6 — they're the foundation of KPI aggregation.
event_types:
  - id: cycle_started
    when: "Once, at cycle start"
    extra_fields: [cycle_unit, planned_targets]

  - id: task_executed
    when: "For every task execution within the cycle (the denominator of hitl_intervention_rate)"
    extra_fields: [task_label, outcome]

  - id: hitl_gate_fired
    when: "When an approval gate fires (the numerator of hitl_intervention_rate)"
    extra_fields: [trigger_id, reason, approver_role]

  - id: hitl_responded
    when: "When an approve/reject response is received"
    extra_fields: [paired_sequence, decision, responded_by, latency_min]

  - id: error_occurred
    when: "An error during the cycle (at any time)"
    extra_fields: [error_class, severity, recovery_action]

  - id: cycle_completed
    when: "Once, at cycle end (success/aborted)"
    extra_fields: [status, totals, kpi_snapshot]

# ------------------------------------------------------------
# Correspondence with aggregation (the mapping onto KPIs)
# ------------------------------------------------------------
kpi_mapping:
  cycle_completion_rate: "count(cycle_completed) / count(cycle_started)"
  hitl_intervention_rate: "count(hitl_gate_fired) / count(task_executed)"

# ------------------------------------------------------------
# Invariants (log integrity)
# ------------------------------------------------------------
invariants:
  - "Every cycle has exactly one cycle_started and one cycle_completed"
  - "sequence increases monotonically within the same cycle"
  - "Every hitl_gate_fired has a corresponding hitl_responded or error_occurred"

# ------------------------------------------------------------
# Example event entries
# ------------------------------------------------------------
examples:
  - '{"ts":"2026-07-06T00:00:00Z","team_id":"ec-team","cycle_id":"2026-07-06","event_type":"cycle_started","sequence":1,"cycle_unit":"weekly"}'
  - '{"ts":"2026-07-06T01:00:00Z","team_id":"ec-team","cycle_id":"2026-07-06","event_type":"hitl_gate_fired","sequence":5,"trigger_id":"large-deal","approver_role":"owner"}'
  - '{"ts":"2026-07-12T23:00:00Z","team_id":"ec-team","cycle_id":"2026-07-06","event_type":"cycle_completed","sequence":42,"status":"success"}'
