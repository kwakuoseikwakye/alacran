# =============================================================================
# 共通 振り返りパターン（KPT + pivot 判定の骨格）
# =============================================================================
# どんなチーム・部門でも使える振り返りの「共通骨格」を示す参照ファイルです。
# チーム個別の振り返り仕様は docs/templates/retrospective-template.yaml を
# definitions/retro/<team>-retrospective.yaml にコピーして記入します。本ファイルは
# 「週次 KPT」と「月次 pivot 判定」の型を示す設計リファレンスで、直接コピーして
# 使うものではありません。
#
# 記入済みの例: examples/harukaze-ec/definitions/retro/ec-team-retrospective.yaml
# =============================================================================

version: 1
kind: retrospective_pattern
pattern_id: common-retro-pattern

# =============================================================================
# 1. 週次振り返り（KPT）
# =============================================================================
# サイクル単位が weekly のチームは必須。monthly のチームでも任意で持ってよい。
weekly_retrospective:
  trigger_hint:
    schedule: "サイクル末（例: 金曜 17:00）"
    duration_minutes: 30
  output_path_hint: "docs/retros/<team-id>/weekly/{YYYY-Www}.md"

  required_sections:
    - id: kpi_dashboard
      title: "## 1. KPI ダッシュボード"
      content: "共通 2 KPI + 固有 KPI の実績 vs 目標テーブル"
    - id: kpt
      title: "## 2. KPT（Keep / Problem / Try）"
      subsections:
        keep: "今サイクルで機能したこと・続けたいこと"
        problem: "閾値超過や観察された摩擦・詰まり"
        try: "次サイクルで試す改善（1〜3 件）"
    - id: decision_pending
      title: "## 3. 保留中の意思決定"
      content: "サイクル中に保留した判断（title / 提起日 / blocker / 解決予定サイクル）"
    - id: next_cycle_action
      title: "## 4. 次サイクルのアクション"
      content: "Try と保留判断の解決期限から作る TODO（担当・期限つき）"

# =============================================================================
# 2. 月次振り返り（続けるか見直すかの pivot 判定）
# =============================================================================
# サイクル単位に依らず、全チームで持つ「本番化/継続判断」のレイヤー。
monthly_retrospective:
  trigger_hint:
    schedule: "月末（例: 最終金曜 17:00）"
    duration_minutes: 60
  output_path_hint: "docs/retros/<team-id>/monthly/{YYYY-MM}.md"

  required_sections:
    - id: kpi_trend
      title: "## 1. KPI トレンド（直近 4 サイクル）"
      content: "全 KPI の 4 サイクル分トレンドと目標達成率"
    - id: pivot_judgment
      title: "## 2. Pivot 判定"
      content: "下記 4 区分のいずれかを verdict として選び、根拠を書く"

  # --- pivot 判定の 4 区分 ---
  pivot_verdicts:
    continue:
      meaning: "現状維持"
      criteria: "共通 2 KPI が 4 サイクル連続で目標達成、固有 KPI の閾値超過なし"
    extend:
      meaning: "運用範囲を広げる（新チャネル/自動化の追加検討）"
      criteria: "運用が 4 サイクル安定し、担当が拡張の必要性を挙げた"
    pivot:
      meaning: "サイクル設計を見直す"
      criteria: "共通 KPI が 3 サイクル連続で未達、または固有 KPI の閾値超過が多発"
    retire:
      meaning: "この運用を畳む（チーム再編・撤退）"
      criteria: "対象事業の撤退、または運用の全面再設計が必要"

  cross_reference:
    weekly_aggregation: "直近 4 サイクルの週次 KPT をまとめて重複除去する"
    decision_promotion: "解決した保留判断を docs/decisions/ の Decision RFC に昇格させる"

# =============================================================================
# 3. 記録先の約束
# =============================================================================
storage:
  weekly_path_hint: "docs/retros/<team-id>/weekly/"
  monthly_path_hint: "docs/retros/<team-id>/monthly/"
  git_tracked: true
  note: "振り返り記録そのものは docs/retros/ に一本化する（/retro コマンドが補助）"
