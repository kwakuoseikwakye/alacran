# =============================================================================
# Common retrospective pattern (the KPT + pivot-decision skeleton)
# =============================================================================
# A reference file showing the "common skeleton" of a retrospective that any team/department
# can use. A team's individual retrospective spec is filled in by copying
# docs/templates/retrospective-template.yaml to definitions/retro/<team>-retrospective.yaml.
# This file is a design reference showing the shape of "weekly KPT" and "monthly pivot
# decisions" — it isn't meant to be copied and used directly.
#
# Filled-in example: examples/harukaze-ec/definitions/retro/ec-team-retrospective.yaml
# =============================================================================

version: 1
kind: retrospective_pattern
pattern_id: common-retro-pattern

# =============================================================================
# 1. Weekly retrospective (KPT)
# =============================================================================
# Mandatory for teams whose cycle unit is weekly. Optional even for monthly teams.
weekly_retrospective:
  trigger_hint:
    schedule: "End of the cycle (e.g. Friday 17:00)"
    duration_minutes: 30
  output_path_hint: "docs/retros/<team-id>/weekly/{YYYY-Www}.md"

  required_sections:
    - id: kpi_dashboard
      title: "## 1. KPI dashboard"
      content: "A results-vs-target table for the 2 common KPIs + team-specific KPIs"
    - id: kpt
      title: "## 2. KPT (Keep / Problem / Try)"
      subsections:
        keep: "What worked this cycle and should continue"
        problem: "Threshold breaches or observed friction/sticking points"
        try: "Improvements to try next cycle (1-3 items)"
    - id: decision_pending
      title: "## 3. Decisions pending"
      content: "Decisions held pending during the cycle (title / date raised / blocker / cycle expected to resolve)"
    - id: next_cycle_action
      title: "## 4. Next cycle's actions"
      content: "A TODO list (with owner and deadline) built from Try items and pending-decision resolution deadlines"

# =============================================================================
# 2. Monthly retrospective (the continue-or-reconsider pivot decision)
# =============================================================================
# The "go-live/continue" decision layer every team keeps, regardless of cycle unit.
monthly_retrospective:
  trigger_hint:
    schedule: "End of month (e.g. last Friday, 17:00)"
    duration_minutes: 60
  output_path_hint: "docs/retros/<team-id>/monthly/{YYYY-MM}.md"

  required_sections:
    - id: kpi_trend
      title: "## 1. KPI trend (last 4 cycles)"
      content: "The 4-cycle trend and target-achievement rate for every KPI"
    - id: pivot_judgment
      title: "## 2. Pivot decision"
      content: "Pick one of the 4 categories below as the verdict, and state the reasoning"

  # --- The 4 categories of pivot decision ---
  pivot_verdicts:
    continue:
      meaning: "Keep the current course"
      criteria: "The 2 common KPIs hit target for 4 consecutive cycles, with no team-specific KPI threshold breaches"
    extend:
      meaning: "Broaden the scope of operations (consider adding a new channel/automation)"
      criteria: "Operations have been stable for 4 cycles, and the team has raised a need to expand"
    pivot:
      meaning: "Reconsider the cycle design"
      criteria: "The common KPIs missed target for 3 consecutive cycles, or team-specific KPI threshold breaches are frequent"
    retire:
      meaning: "Wind down this operation (team reorganization / withdrawal)"
      criteria: "The target business is being withdrawn, or the operation needs a full redesign"

  cross_reference:
    weekly_aggregation: "Roll up and deduplicate the last 4 cycles' weekly KPT"
    decision_promotion: "Promote resolved pending decisions to a Decision RFC in docs/decisions/"

# =============================================================================
# 3. Conventions for where records live
# =============================================================================
storage:
  weekly_path_hint: "docs/retros/<team-id>/weekly/"
  monthly_path_hint: "docs/retros/<team-id>/monthly/"
  git_tracked: true
  note: "Consolidate the retrospective record itself under docs/retros/ (the /retro command helps)"
