# =============================================================================
# Common KPI pattern (an industry-agnostic KPI-measurement skeleton)
# =============================================================================
# A reference file showing the "common skeleton" of KPI measurement that any team/department
# can use. A team's individual KPI spec is filled in by copying
# docs/templates/kpi-measurement-template.yaml to definitions/kpi/<team>-kpi.yaml. This file
# is a design reference showing "the KPIs every team must always have" and "how to add
# industry-specific KPIs on top" — it isn't meant to be copied and used directly.
#
# Filled-in example: examples/harukaze-ec/definitions/kpi/ec-team-kpi.yaml
# =============================================================================

version: 1
kind: kpi_pattern
pattern_id: common-kpi-pattern

# =============================================================================
# 1. The common structure of the measurement infrastructure (3 elements)
# =============================================================================
# The values vary by team, but every team shares this 3-element "frame".
measurement_infrastructure:
  collection_window:
    # The measurement window (from when to when 1 cycle is aggregated over)
    required_fields: [cycle_start, cycle_end, duration_hours, measurement_finalize]
    weekly_hint: "duration_hours ≈ 167 (weekly)"
    monthly_hint: "duration_hours ≈ 720 (monthly)"

  data_sources:
    # Where the aggregation is sourced from. At least one should be a cycle log (git-tracked).
    cycle_log:
      path_hint: "state/cycles/<team-id>/<YYYY-MM-DD>/cycle.jsonl"
      format: jsonl
      note: "Appended to by the cycle-operations script (per cycle-execution-log-schema.yaml)"
    industry_source_hint: "Add an industry-specific source (e.g. an order-export CSV / an inquiry log)"

  notification:
    # Abstract the notification method down to 2 choices your company can actually operate.
    channels:
      - id: github_label
        use_for: "A warning-level alert (labels an Issue to notify the person in charge)"
      - id: manual
        use_for: "A critical alert (confirm immediately with the person in charge via chat/verbally)"

# =============================================================================
# 2. Common KPIs (the 2 every team must always define)
# =============================================================================
common_kpis:
  cycle_completion_rate:
    description: "The proportion of cycles where every phase completed by its deadline"
    target_hint: 0.95                 # a shared benchmark across all teams
    measurement_formula: |
      completed_cycles / total_cycles
      completed_cycles = count(event.type == "cycle_completed")
      total_cycles     = count(event.type == "cycle_started")
    threshold_hint:
      low_alert: "Falls well short of target for 3 consecutive cycles"
    data_source: cycle_log

  hitl_intervention_rate:
    description: "The proportion of all tasks that went through a human approval gate (lower = more autonomous)"
    target_hint: "0.20-0.30 per team (higher for teams with more approval-requiring work)"
    measurement_formula: |
      hitl_invoked / total_tasks
      hitl_invoked = count(event.type == "hitl_gate_fired")
      total_tasks  = count(event.type == "task_executed")
    threshold_hint:
      low_alert: "Exceeds target + 0.10 for 3 consecutive cycles"
    data_source: cycle_log

# =============================================================================
# 3. How to add industry-specific KPIs
# =============================================================================
# On top of the 2 common KPIs, add 2 or more team-specific KPIs. Every KPI must always have
# these 7 fields: description / target / measurement_formula / threshold / notification /
# data_source / audit_format.
industry_kpi_guidance:
  min_count: 2
  required_fields_per_kpi:
    - description
    - target
    - measurement_formula
    - threshold
    - notification            # github_label / manual / null
    - data_source
    - audit_format
  examples_by_industry:
    ec: [conversion_rate, repeat_purchase_rate, inventory_turnover_days]
    support: [first_response_hours, resolution_rate]
    manufacturing: [on_time_delivery_rate, quality_rejection_count]
    professional_services: [billable_ratio, escalation_count]

# =============================================================================
# 4. Weekly digest (common)
# =============================================================================
weekly_digest:
  description: "The KPI dashboard generated at the point of the weekly retrospective"
  format: markdown
  output_path_hint: "docs/retros/<team-id>/weekly/{YYYY-Www}.md"
  contents:
    - "A results-vs-target table for every KPI"
    - "A summary of threshold-breach alerts"
    - "The last 4 cycles' moving-average trend"
    - "Recommended actions for the next cycle"
