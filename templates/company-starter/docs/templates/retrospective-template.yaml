# =============================================================================
# Template — the source for definitions/retro/<team>-retrospective.yaml
# =============================================================================
# The starting point for standing up a team/department's retrospective shape (weekly KPT +
# monthly pivot decisions). This file itself is not live. Copy it and fill it in.
#
# Explanation of the common skeleton: docs/templates/common-retro-pattern.yaml
# Filled-in example:                  examples/harukaze-ec/definitions/retro/ec-team-retrospective.yaml
# Related:                            docs/templates/kpi-measurement-template.yaml /
#                                      docs/templates/cycle-plan-template.yaml
#
# How to use:
# 1. Copy this file to definitions/retro/<team>-retrospective.yaml
# 2. Fill in every <<TODO_*>>, and make the team explicit via team_id
# 3. Whichever matches your cycle unit (weekly / monthly) is mandatory to fill in
# 4. The monthly pivot decision is one of 4 categories: continue / extend / pivot / retire
# 5. The retrospective record itself goes in docs/retros/<team>/ (the /retro command helps)
# =============================================================================

version: 1
schema_version_meta: "<<TODO_YYYY-MM-DD>>"
status: draft
team_id: <<TODO_team_id>>                          # e.g. ec-team (matches org.team's team_id)

# =============================================================================
# Weekly retrospective (mandatory if cycle_unit = weekly; optional even for monthly)
# =============================================================================
weekly_retrospective:
  trigger:
    schedule: "<<TODO_weekly_schedule>>"           # e.g. "Friday 17:00 JST"
    timezone: "Asia/Tokyo"
    duration_minutes: 30
  output_path: "docs/retros/<<TODO_team_id>>/weekly/{YYYY-Www}.md"

  # The 4 mandatory sections (centered on KPT)
  required_sections:
    - id: kpi_dashboard
      title: "## 1. KPI dashboard"
      content: "A results-vs-target table for the 2 common KPIs + team-specific KPIs (pulled from the KPI weekly_digest)"
    - id: kpt
      title: "## 2. KPT (Keep / Problem / Try)"
      subsections:
        keep: "What worked this cycle and should continue"
        problem: "Threshold breaches or observed friction/sticking points"
        try: "Improvements to try next cycle (1-3 items)"
    - id: decision_pending
      title: "## 3. Decisions pending"
      content: "Decisions held pending during the cycle (title / date raised / blocker / cycle expected to resolve)"
    - id: next_cycle_action
      title: "## 4. Next cycle's actions"
      content: "A TODO list (with owner and deadline) built from Try items and pending-decision resolution deadlines"

# =============================================================================
# Monthly retrospective (the continue-or-reconsider pivot-decision layer)
# =============================================================================
monthly_retrospective:
  trigger:
    schedule: "<<TODO_monthly_schedule>>"          # e.g. "last Friday of the month, 17:00 JST"
    timezone: "Asia/Tokyo"
    duration_minutes: 60
    occurrence: "<<TODO_occurrence>>"              # e.g. "last_friday_of_month"
  output_path: "docs/retros/<<TODO_team_id>>/monthly/{YYYY-MM}.md"

  required_sections:
    - id: kpi_trend
      title: "## 1. KPI trend (last 4 cycles)"
      content: "The 4-cycle trend and target-achievement rate for every KPI"
    - id: pivot_judgment
      title: "## 2. Pivot decision"
      content: "Pick one verdict from the 4 categories below, and state the reasoning"

  # The 4 categories of pivot decision
  pivot_verdicts:
    continue:
      meaning: "Keep the current course"
      criteria: "The 2 common KPIs hit target for 4 consecutive cycles, with no team-specific KPI threshold breaches"
    extend:
      meaning: "Broaden the scope of operations (consider adding a new channel/automation)"
      criteria: "Operations have been stable for 4 cycles, and the team has raised a need to expand"
    pivot:
      meaning: "Reconsider the cycle design"
      criteria: "The common KPIs missed target for 3 consecutive cycles, or team-specific KPI threshold breaches are frequent"
    retire:
      meaning: "Wind down this operation (team reorganization / withdrawal)"
      criteria: "The target business is being withdrawn, or the operation needs a full redesign"

  cross_reference:
    weekly_aggregation: "Roll up and deduplicate the last 4 cycles' weekly KPT"
    decision_promotion: "Promote resolved pending decisions to a Decision RFC in docs/decisions/"

# =============================================================================
# Where records live
# =============================================================================
storage:
  weekly_path: "docs/retros/<<TODO_team_id>>/weekly/"
  monthly_path: "docs/retros/<<TODO_team_id>>/monthly/"
  git_tracked: true

# =============================================================================
# Checklist for filling it in (applies to the instance created by copying this template)
# =============================================================================
acceptance_criteria:
  - "team_id makes the team explicit"
  - "Whichever matches your cycle unit (weekly / monthly) is chosen, and only that side's sections
     are mandatory to fill in (the side not adopted may stay empty)"
  - "If weekly is adopted: required_sections satisfies kpi_dashboard / kpt (the 3 sections
     keep / problem / try) / decision_pending / next_cycle_action"
  - "If monthly is adopted: required_sections satisfies kpi_trend / pivot_judgment, and
     pivot_verdicts has the 4 categories continue / extend / pivot / retire"
  - "Records are consolidated under docs/retros/<team>/"
  - "Every <<TODO_*>> is filled in"

# Verification: python3 scripts/verify.py's DEF-RETRO-01 (parses + zero remaining <<TODO + team_id present)
