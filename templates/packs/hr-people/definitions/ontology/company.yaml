    - step: Role Scoping & Candidate Sourcing
      owner: talent-lead
    - step: Structured Assessment & Technical Interviews
      owner: talent-lead
    - step: §6 Human Gate Offer & Compensation Approval
      owner: talent-lead
    - step: Team Onboarding & Cultural Integration
      owner: people-partner
