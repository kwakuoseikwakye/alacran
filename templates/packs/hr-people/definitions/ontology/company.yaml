      name: Head of Talent Acquisition
      owns: Recruiting pipeline, candidate experience, and hiring benchmarks
    - id: people-partner
      name: People Operations Partner
      owns: Onboarding workflows, benefits administration, and team retention
    - id: culture-ops
      name: Workplace & Culture Specialist
      owns: Internal documentation, team offsites, and recognition programs
  decisions:
    - decision: Compensation bands, signing bonuses & headcount budget commitments
      approver: talent-lead
